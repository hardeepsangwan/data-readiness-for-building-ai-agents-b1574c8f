# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - webapp-data-blueprint

on:
  push:
    branches:
      - feature/blueprintwithLLMWebapp
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm install and build
        env:
          VITE_SUPABASE_URL: "https://yflfksanbnuzpzzihnod.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_0qB1dL0c6z5W3G2bVn2ufQ_Wites1Bu"
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: List build output (debug)
        run: |
          echo "=== dist/ ===" && ls -la dist/ 2>/dev/null || echo "dist/ not found"
          echo "=== .output/ ===" && ls -la .output/ 2>/dev/null || echo ".output/ not found"
          echo "=== build/ ===" && ls -la build/ 2>/dev/null || echo "build/ not found"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            .output/
            build/
            server.mjs
            web.config
            package.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"39ce4085-4dec-4af5-a794-0b5707aa180b","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"35c7c256-febc-4c53-82a5-71e8573a3c24","tenantId":"d69d99c1-2f5a-482f-b0ea-d8173b4b38bd"}'

      - name: Disable Oryx build on Azure (use pre-built artifact)
        uses: azure/appservice-settings@v1
        with:
          app-name: 'webapp-data-blueprint'
          app-settings-json: '[{"name":"SCM_DO_BUILD_DURING_DEPLOYMENT","value":"false","slotSetting":false},{"name":"WEBSITE_NODE_DEFAULT_VERSION","value":"~22","slotSetting":false}]'

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webapp-data-blueprint'
          slot-name: 'Production'
          package: .

      - name: Restart Web App (ensure new build is picked up)
        run: az webapp restart --name webapp-data-blueprint --resource-group rg-hsangwan-training-001
